name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  PHPUnit:
    strategy:
      matrix:
        include:
          - php-version: "8.0"
            php-unit: "9.6.38"
          - php-version: "8.1"
            php-unit: "9.6.38"
          - php-version: "8.2"
            php-unit: "10.5.66"
          - php-version: "8.3"
            php-unit: "10.5.66"
          - php-version: "8.4"
            php-unit: "10.5.66"
          - php-version: "8.5"
            php-unit: "10.5.66"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Prepare Composer
        uses: ./.github/actions/prepare-composer
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          php-version: ${{ matrix.php-version }}
          package: phpunit/phpunit
          package-version: ${{ matrix.php-unit }}
      - name: Run PHPUnit
        run: composer test
  PHP_CodeSniffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Prepare Composer
        uses: ./.github/actions/prepare-composer
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: squizlabs/php_codesniffer
      - name: Run PHP_CodeSniffer
        run: composer phpcs -- --no-cache
  PHP-CS-Fixer:
    runs-on: ubuntu-latest
    env:
      PHP_CS_FIXER_IGNORE_ENV: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Prepare Composer
        uses: ./.github/actions/prepare-composer
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: friendsofphp/php-cs-fixer
      - name: Run PHP Coding Standards Fixer
        run: composer php-cs-fixer -- --dry-run --diff --using-cache=no
  #composer-normalize:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Checkout
  #      uses: actions/checkout@v3
  #    - name: Prepare Composer
  #      uses: ./.github/actions/prepare-composer
  #      with:
  #        token: ${{ secrets.GITHUB_TOKEN }}
  #        package: ergebnis/composer-normalize
  #        allow-plugins: 1
  #    - name: Run composer-normalize
  #      run: composer normalize --dry-run
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Prepare Composer
        uses: ./.github/actions/prepare-composer
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: phpunit/phpunit
          package-version: "10.5.66"
          coverage: xdebug
      - name: Run PHPUnit with coverage
        run: composer test -- --do-not-cache-result --coverage-clover coverage.xml
      - name: Upload coverage
        uses: codecov/codecov-action@v3
